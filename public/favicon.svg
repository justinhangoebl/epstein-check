<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d50000;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd600;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff6d00;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
        </linearGradient>

        <radialGradient id="bgGrad">
            <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
        </radialGradient>

        <filter id="neon">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>

    <!-- Traffic Light Concept - Three circles stacked vertically -->
    <g transform="translate(200, 170)">
        <!-- Container outline -->
        <rect x="-75" y="-150" width="150" height="300"
                fill="none"
                stroke="#333"
                stroke-width="4"
                rx="20"/>

        <!-- Red Circle (top) -->
        <circle cx="0" cy="-80" r="45"
                fill="url(#redGrad)"
                filter="url(#neon)"
                opacity="1"/>

        <!-- Orange/Yellow Circle (middle) -->
        <circle cx="0" cy="0" r="45"
                fill="url(#yellowGrad)"
                filter="url(#neon)"
                opacity="0.85"/>

        <!-- Green Circle (bottom) -->
        <circle cx="0" cy="80" r="45"
                fill="url(#greenGrad)"
                filter="url(#neon)"
                opacity="0.7"/>

        <!-- Highlight reflections on circles -->
        <circle cx="-15" cy="-92" r="12" fill="white" opacity="0.4"/>
        <circle cx="-15" cy="-12" r="12" fill="white" opacity="0.3"/>
        <circle cx="-15" cy="68" r="12" fill="white" opacity="0.25"/>

        <!-- Checkmark overlay on green -->
        <path d="M -20 80 L -8 95 L 25 60"
                fill="none"
                stroke="#0a0a0a"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.6"/>
    </g>

    <!-- Bottom text label -->
    <text x="200" y="365"
            font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="28"
            font-weight="900"
            fill="#ffffff"
            text-anchor="middle"
            letter-spacing="4">
        EPSTEIN CHECK
    </text>
 </svg>
